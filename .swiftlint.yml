included:
  - Devvit

excluded:
  - Devvit/Resources

disabled_rules:
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - orphaned_doc_comment
  - void_function_in_ternary

opt_in_rules:
  - empty_count
  - force_unwrapping

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 100

type_name:
  min_length: 2
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - db
    - a
    - r
    - g
    - b
